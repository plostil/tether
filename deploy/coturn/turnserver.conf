# coturn config for Tether (SPEC §4: ICE = STUN + our own TURN).
#
# Ephemeral credentials use coturn's REST scheme (use-auth-secret), which is
# exactly what apps/server/src/turn.ts issues:
#   username   = "<unix-expiry>"      (optionally "<expiry>:<userId>")
#   credential = base64(HMAC-SHA1(static-auth-secret, username))
#
# static-auth-secret, external-ip, and realm are supplied on the command line
# from the .env (see docker-compose.yml) so no secret lives in this file.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Ephemeral REST credentials (time-limited, no user database).
use-auth-secret

# Relay port range — OPEN THESE UDP PORTS on the host firewall / cloud SG.
min-port=49160
max-port=49200

# Hardening.
no-cli
no-tcp-relay
no-multicast-peers
fingerprint
stale-nonce=600
# Refuse relaying to private/loopback ranges (SSRF / internal-network guard).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# TLS for turns:5349 — mount certs and uncomment (e.g. share Caddy's certs or
# use certbot). Without these, only turn:3478 (plain) is available.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
