# Fly.io deployment for the SIGNALING BROKER ONLY.
#   fly launch --no-deploy   # once, to create the app
#   fly secrets set TURN_SECRET=$(openssl rand -hex 32)
#   fly deploy
#
# TURN is NOT here: coturn needs a public IP + a directly-reachable UDP relay
# port range, which Fly's proxy does not fit well. Run coturn on a plain VM
# (see docker-compose.yml / DEPLOY.md) and point TURN_URIS/STUN_URIS at it.

app = "tether-broker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Point these at your separately-hosted coturn:
  # STUN_URIS = "stun:turn.example.com:3478"
  # TURN_URIS = "turn:turn.example.com:3478?transport=udp"
  # (TURN_SECRET is set via `fly secrets set`, never in this file.)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
